<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="용돈관리" />
  <title>용돈 관리</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#F2F2F7;color:#1C1C1E;min-height:100dvh;padding-bottom:calc(env(safe-area-inset-bottom)+16px)}
    .header{background:linear-gradient(135deg,#4F46E5 0%,#7C3AED 100%);padding:calc(env(safe-area-inset-top)+20px) 20px 20px;color:white}
    .header-top{display:flex;justify-content:space-between;align-items:flex-start}
    .header-month{font-size:11px;opacity:.8;margin-bottom:4px}
    .header-balance{font-size:27px;font-weight:700;margin-bottom:16px;letter-spacing:-0.5px}
    .header-right{display:flex;gap:8px;align-items:flex-start}
    .hdr-btn{background:rgba(255,255,255,.2);border:none;border-radius:10px;padding:7px 9px;color:white;cursor:pointer;font-size:11px;font-weight:600;font-family:inherit;line-height:1;display:flex;align-items:center;gap:4px}
    .summary-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .summary-card{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 12px}
    .summary-label{font-size:10px;opacity:.8;margin-bottom:4px;display:flex;align-items:center;gap:4px}
    .summary-amount{font-size:14px;font-weight:600}
    .tab-bar{display:flex;background:white;border-bottom:1px solid #E5E5EA;position:sticky;top:0;z-index:10}
    .tab{flex:1;padding:8px 4px;text-align:center;font-size:9px;color:#8E8E93;cursor:pointer;border-bottom:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
    .tab svg{width:18px;height:18px}
    .tab.active{color:#4F46E5;border-bottom-color:#4F46E5}
    .content{padding:12px;display:none}
    .content.active{display:block}
    .section-title{font-size:10px;color:#8E8E93;font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
    .tx-item{background:white;border-radius:12px;padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .tx-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .tx-icon.income{background:#E8F5E9}
    .tx-icon.expense{background:#FEE8E8}
    .tx-info{flex:1;min-width:0;cursor:pointer}
    .tx-desc{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tx-meta{font-size:10px;color:#8E8E93;margin-top:2px}
    .tx-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
    .tx-amount{font-size:12px;font-weight:700}
    .tx-amount.income{color:#34C759}
    .tx-amount.expense{color:#FF3B30}
    .tx-actions{display:flex;gap:6px}
    .tx-btn{background:none;border:none;font-size:14px;cursor:pointer;padding:2px;line-height:1}
    .tx-edit-btn{color:#4F46E5}
    .tx-del-btn{color:#C7C7CC}
    .form-card{background:white;border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:10px}
    .type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
    .type-btn{padding:10px;border-radius:10px;border:1.5px solid #E5E5EA;background:#F9F9F9;color:#8E8E93;font-size:12px;font-weight:600;cursor:pointer;text-align:center;font-family:inherit}
    .type-btn.selected-income{background:#E8F5E9;border-color:#34C759;color:#1B7A2E}
    .type-btn.selected-expense{background:#FEE8E8;border-color:#FF3B30;color:#B71C1C}
    .form-group{margin-bottom:11px}
    .form-label{font-size:10.5px;color:#8E8E93;font-weight:500;margin-bottom:5px;display:block}
    .quick-btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
    .quick-btn{padding:6px 11px;border-radius:16px;border:1.5px solid #E5E5EA;background:#F9F9F9;font-size:10.5px;font-weight:500;color:#3A3A3C;cursor:pointer;font-family:inherit;white-space:nowrap}
    .quick-btn.selected{background:#EEF2FF;border-color:#4F46E5;color:#4F46E5}
    .form-input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid #E5E5EA;background:#F9F9F9;color:#1C1C1E;font-size:13px;font-family:inherit;outline:none}
    .form-input:focus{border-color:#4F46E5;background:white}
    .submit-btn{width:100%;padding:13px;background:#4F46E5;color:white;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:7px}
    .submit-btn:active{opacity:.85}
    .cancel-btn{width:100%;padding:11px;background:#F2F2F7;color:#8E8E93;border:none;border-radius:12px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:7px}
    .chart-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .chart-stat{background:white;border-radius:12px;padding:11px;box-shadow:0 1px 3px rgba(0,0,0,.06);text-align:center}
    .chart-stat-label{font-size:10px;color:#8E8E93;margin-bottom:4px}
    .chart-stat-val{font-size:16px;font-weight:700}
    .chart-section-title{font-size:10.5px;color:#8E8E93;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin:13px 0 8px}
    .cat-card{background:white;border-radius:12px;padding:11px 13px;margin-bottom:7px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .cat-card-header{display:flex;align-items:center;gap:9px;margin-bottom:9px}
    .cat-icon-big{font-size:18px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:#F2F2F7}
    .cat-card-info{flex:1}
    .cat-card-name{font-size:12px;font-weight:600}
    .cat-card-count{font-size:10px;color:#8E8E93;margin-top:1px}
    .cat-card-total{font-size:14px;font-weight:700}
    .cat-bar-track{height:5px;background:#F2F2F7;border-radius:3px;overflow:hidden;margin-bottom:9px}
    .cat-bar-fill{height:100%;border-radius:3px}
    .sub-items{border-top:1px solid #F2F2F7;padding-top:8px;display:none}
    .sub-items.open{display:block}
    .sub-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #F2F2F7}
    .sub-item:last-child{border-bottom:none}
    .sub-item-left{display:flex;flex-direction:column;gap:2px}
    .sub-item-desc{font-size:10.5px;color:#3A3A3C}
    .sub-item-date{font-size:9px;color:#C7C7CC}
    .sub-item-right{display:flex;align-items:center;gap:8px}
    .sub-item-amt{font-size:10.5px;font-weight:600}
    .sub-edit-btn{background:none;border:none;font-size:13px;color:#4F46E5;cursor:pointer;padding:2px}
    .toggle-detail{font-size:10px;color:#4F46E5;cursor:pointer;border:none;background:none;font-family:inherit;padding:0}
    .settings-section{background:white;border-radius:12px;padding:13px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .settings-section-title{font-size:11px;font-weight:600;margin-bottom:10px}
    .preset-manage-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F2F2F7}
    .preset-manage-item:last-child{border-bottom:none}
    .preset-emoji-input{width:38px;padding:5px;border-radius:7px;border:1.5px solid #E5E5EA;background:#F9F9F9;font-size:15px;text-align:center;font-family:inherit;outline:none}
    .preset-name-input{flex:1;padding:7px 9px;border-radius:7px;border:1.5px solid #E5E5EA;background:#F9F9F9;font-size:11px;font-family:inherit;outline:none;color:#1C1C1E}
    .preset-emoji-input:focus,.preset-name-input:focus{border-color:#4F46E5;background:white}
    .preset-del-btn{background:none;border:none;font-size:17px;color:#FF3B30;cursor:pointer;padding:2px;opacity:.6}
    .add-preset-row{display:flex;align-items:center;gap:7px;margin-top:10px}
    .add-preset-emoji{width:38px;padding:7px;border-radius:9px;border:1.5px dashed #C7C7CC;background:#F9F9F9;font-size:15px;text-align:center;font-family:inherit;outline:none}
    .add-preset-name{flex:1;padding:8px;border-radius:9px;border:1.5px dashed #C7C7CC;background:#F9F9F9;font-size:11px;font-family:inherit;outline:none;color:#1C1C1E}
    .add-preset-name::placeholder{color:#C7C7CC}
    .add-preset-btn{padding:8px 12px;border-radius:9px;background:#4F46E5;color:white;border:none;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
    .backup-btn{width:100%;padding:12px;border-radius:10px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px}
    .backup-btn-primary{background:#4F46E5;color:white}
    .backup-btn-success{background:#E8F5E9;color:#1B7A2E;border:1.5px solid #34C759}
    .backup-log{font-size:10px;color:#8E8E93;margin-top:4px;text-align:center}
    .backup-history-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F2F2F7;font-size:10.5px}
    .backup-history-item:last-child{border-bottom:none}
    .backup-history-date{color:#3A3A3C;font-weight:500}
    .backup-history-info{color:#8E8E93;font-size:10px}
    .restore-btn{padding:5px 10px;border-radius:7px;background:#EEF2FF;color:#4F46E5;border:none;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit}
    .option-row{display:flex;flex-direction:column;gap:7px}
    .option-item{width:100%;display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;border:1.5px solid #E5E5EA;background:#F9F9F9;cursor:pointer;font-family:inherit;text-align:left}
    .option-item.active{background:#EEF2FF;border-color:#4F46E5}
    .opt-flag{font-size:20px;flex-shrink:0}
    .opt-info{flex:1;display:flex;flex-direction:column;gap:2px}
    .opt-name{font-size:12px;font-weight:600;color:#1C1C1E}
    .opt-sub{font-size:10px;color:#8E8E93}
    .opt-check{font-size:13px;color:#4F46E5;font-weight:700;width:18px;text-align:right}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end}
    .modal-overlay.open{display:flex}
    .modal-sheet{background:white;border-radius:24px 24px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom)+18px);width:100%;max-height:90dvh;overflow-y:auto}
    .modal-handle{width:36px;height:4px;background:#E5E5EA;border-radius:2px;margin:0 auto 16px}
    .modal-title{font-size:14px;font-weight:700;margin-bottom:14px;text-align:center}
    .modal-type-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
    .alert-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
    .alert-modal.open{display:flex}
    .alert-box{background:white;border-radius:18px;padding:20px;width:100%;max-width:300px;text-align:center}
    .alert-icon{font-size:36px;margin-bottom:10px}
    .alert-title{font-size:14px;font-weight:700;margin-bottom:7px}
    .alert-desc{font-size:11px;color:#8E8E93;line-height:1.6;margin-bottom:16px}
    .alert-btn-row{display:flex;flex-direction:column;gap:7px}
    .alert-btn-main{padding:12px;background:#4F46E5;color:white;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
    .alert-btn-sub{padding:10px;background:#F2F2F7;color:#8E8E93;border:none;border-radius:10px;font-size:12px;cursor:pointer;font-family:inherit}
    .empty{text-align:center;padding:40px 16px;color:#8E8E93}
    .empty-icon{font-size:40px;margin-bottom:10px}
    .empty-text{font-size:12px;line-height:1.6}
    .toast{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1C1C1E;color:white;padding:9px 18px;border-radius:18px;font-size:11px;font-weight:500;opacity:0;transition:opacity .3s;white-space:nowrap;z-index:400;pointer-events:none}
    .toast.show{opacity:1}
    input[type="file"]{display:none}
    /* ── 홈 대시보드 ── */
    .home-wrap{display:flex;flex-direction:column;gap:10px}

    /* 상단: 월 누적 + 오늘 */
    .top-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .month-panel{background:linear-gradient(160deg,#4F46E5 0%,#7C3AED 100%);border-radius:16px;padding:14px 13px;color:white}
    .mp-title{font-size:9px;opacity:.75;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
    .mp-row{margin-bottom:10px}
    .mp-label{font-size:9px;opacity:.75;margin-bottom:2px}
    .mp-val{font-size:17px;font-weight:700;letter-spacing:-0.3px}
    .mp-sub{font-size:9px;opacity:.7;margin-top:1px}
    .mp-divider{height:1px;background:rgba(255,255,255,.2);margin:10px 0}
    .mp-progress-track{height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;margin-bottom:4px}
    .mp-progress-fill{height:100%;border-radius:3px;transition:width .5s}
    .mp-progress-labels{display:flex;justify-content:space-between;font-size:8px;opacity:.65}
    .mp-today-box{background:rgba(255,255,255,.15);border-radius:10px;padding:9px 10px;margin-top:10px}
    .mp-today-label{font-size:9px;opacity:.8;margin-bottom:4px}
    .mp-today-val{font-size:19px;font-weight:700}
    .mp-today-diff{font-size:10px;font-weight:600;margin-top:3px;padding:3px 8px;border-radius:12px;display:inline-block}
    .mp-today-diff.under{background:rgba(52,199,89,.25);color:#90EEA0}
    .mp-today-diff.over{background:rgba(255,59,48,.25);color:#FFB3AE}
    .mp-today-diff.exact{background:rgba(255,255,255,.2);color:white}

    /* 오른쪽: 세로 막대 그래프 */
    .chart-panel{background:white;border-radius:16px;padding:12px 8px 8px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
    .cp-title{font-size:9px;color:#8E8E93;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;padding:0 4px}
    .cp-legend{display:flex;gap:8px;padding:0 4px;margin-bottom:8px}
    .cp-legend-item{display:flex;align-items:center;gap:3px;font-size:8px;color:#8E8E93}
    .cp-legend-dot{width:6px;height:6px;border-radius:2px;flex-shrink:0}
    .bar-chart-area{position:relative;height:200px;overflow-x:auto;overflow-y:hidden}
    .bar-chart-inner{display:flex;align-items:flex-end;gap:2px;height:100%;min-width:100%;padding:0 2px}
    .bar-col{display:flex;flex-direction:column;align-items:center;gap:1px;flex:1;min-width:7px;height:100%;justify-content:flex-end;position:relative}
    .bar-col.is-today .bar-target{outline:1.5px solid #4F46E5;outline-offset:1px;border-radius:2px}
    .bar-target{position:absolute;bottom:0;width:100%;border-radius:2px 2px 0 0;opacity:.25;background:#4F46E5}
    .bar-actual{position:absolute;bottom:0;width:70%;border-radius:2px 2px 0 0;z-index:1}
    .bar-day-label{font-size:7px;color:#8E8E93;text-align:center;margin-top:3px;flex-shrink:0;line-height:1}
    .bar-day-label.is-today{color:#4F46E5;font-weight:700}
    .bar-day-label.is-sun{color:#FF3B30}
    .bar-day-label.is-sat{color:#4F46E5}
    .bar-future .bar-target{opacity:.1}
    .bar-future .bar-day-label{opacity:.35}
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-top">
    <div>
      <div class="header-month" id="header-month"></div>
      <div id="lbl-balance" style="font-size:10px;opacity:.75;margin-bottom:2px;letter-spacing:.3px"></div>
      <div class="header-balance" id="balance">₩0</div>
    </div>
    <div class="header-right">
      <button class="hdr-btn" onclick="manualBackup()" id="hdr-backup-btn">💾</button>
    </div>
  </div>
  <div class="summary-row">
    <div class="summary-card">
      <div class="summary-label" id="lbl-income-header">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </div>
      <div class="summary-amount" id="total-income">₩0</div>
    </div>
    <div class="summary-card">
      <div class="summary-label" id="lbl-expense-header">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
      </div>
      <div class="summary-amount" id="total-expense">₩0</div>
    </div>
  </div>
</div>

<!-- Tab bar -->
<div class="tab-bar">
  <div class="tab active" id="tab-home" onclick="switchTab('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span data-i18n="tab_home"></span>
  </div>
  <div class="tab" id="tab-list" onclick="switchTab('list')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    <span data-i18n="tab_list"></span>
  </div>
  <div class="tab" id="tab-add" onclick="switchTab('add')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
    <span data-i18n="tab_add"></span>
  </div>
  <div class="tab" id="tab-chart" onclick="switchTab('chart')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
    <span data-i18n="tab_chart"></span>
  </div>
  <div class="tab" id="tab-settings" onclick="switchTab('settings')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06-.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span data-i18n="tab_settings"></span>
  </div>
</div>

<!-- 홈(예산) 탭 -->
<div class="content active" id="content-home">
  <div id="home-content"></div>
</div>

<!-- 내역 탭 -->
<div class="content" id="content-list">
  <div class="section-title" data-i18n="list_title"></div>
  <div id="tx-list"></div>
</div>

<!-- 추가 탭 -->
<div class="content" id="content-add">
  <div class="form-card">
    <div class="type-toggle">
      <button class="type-btn selected-income" id="btn-income" onclick="selectType('income')">💰 <span data-i18n="income"></span></button>
      <button class="type-btn" id="btn-expense" onclick="selectType('expense')">💸 <span data-i18n="expense"></span></button>
    </div>
    <div class="form-group">
      <label class="form-label" data-i18n="label_select"></label>
      <div class="quick-btns" id="quick-btns"></div>
      <input class="form-input" id="inp-desc" type="text" />
    </div>
    <div class="form-group">
      <label class="form-label" for="inp-amount" data-i18n="label_amount"></label>
      <input class="form-input" id="inp-amount" type="number" inputmode="numeric" min="0" placeholder="0" />
    </div>
    <div class="form-group">
      <label class="form-label" for="inp-date" data-i18n="label_date"></label>

let lang = localStorage.getItem('pocket_lang') || 'ko';
function t(key, ...args) {
  const v = I18N[lang][key];
  if(typeof v === 'function') return v(...args);
  return v !== undefined ? v : key;
}

function applyI18n() {
  // 1. data-i18n 속성 정적 요소
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  // 2. 헤더 잔액 레이블
  const lblBal = document.getElementById('lbl-balance');
  if(lblBal) lblBal.textContent = t('lbl_balance');
  // 3. 헤더 수입/지출 라벨 (SVG 포함)
  const svgUp = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  const svgDn = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>';
  document.getElementById('lbl-income-header').innerHTML = svgUp + t('lbl_income');
  document.getElementById('lbl-expense-header').innerHTML = svgDn + t('lbl_expense');
  // 4. 추가 탭 수입/지출 버튼 (텍스트 노드 직접 교체)
  setTypeBtnText('btn-income', '💰', t('income'));
  setTypeBtnText('btn-expense', '💸', t('expense'));
  // 5. 수정 모달 수입/지출 버튼
  setTypeBtnText('edit-btn-income', '💰', t('income'));
  setTypeBtnText('edit-btn-expense', '💸', t('expense'));
  // 6. placeholder
  document.getElementById('inp-desc').placeholder = t('inp_desc_placeholder');
  document.getElementById('edit-desc').placeholder = t('inp_desc_placeholder');
  document.getElementById('add-income-name').placeholder = t('inp_preset_placeholder');
  document.getElementById('add-expense-name').placeholder = t('inp_preset_placeholder');
  // 7. 백업 알림 desc
  document.getElementById('backup-alert-desc').innerHTML = t('alert_backup_desc');
}

function setTypeBtnText(id, emoji, label) {
  const btn = document.getElementById(id);
  if(!btn) return;
  // span 내부 텍스트만 갱신 (class 유지)
  const span = btn.querySelector('span');
  if(span) { span.textContent = label; }
  else { btn.textContent = emoji + ' ' + label; }
}

function selectLang(l) {
  lang = l;
  localStorage.setItem('pocket_lang', l);
  initLangUI();
  render();          // 동적 HTML 먼저 생성
  applyI18n();       // 그 후 전체 텍스트 적용
  renderSettings();
  showToast(t('lang_changed'));
}
function initLangUI() {
  ['ko','en'].forEach(k => {
    document.getElementById('lang-'+k)?.classList.toggle('active', k===lang);
    const chk = document.getElementById('chk-lang-'+k);
    if(chk) chk.textContent = k===lang ? '✓' : '';
  });
}

function buildCatSection(items,total,prefix,isIncome){
  if(!items.length) return `<div class="empty" style="padding:24px 0"><div class="empty-icon">${isIncome?'💰':'📊'}</div><div class="empty-text">${t(isIncome?'empty_chart_inc':'empty_chart_exp')}</div></div>`;
  const catMap={};
  items.forEach(tx=>{if(!catMap[tx.cat])catMap[tx.cat]={total:0,items:[]};catMap[tx.cat].total+=tx.amount;catMap[tx.cat].items.push(tx);});
  const sorted=Object.entries(catMap).sort((a,b)=>b[1].total-a[1].total);
  const maxTotal=sorted[0][1].total;
  let html='';
  sorted.forEach(([cat,data],idx)=>{
    const pct=Math.round(data.total/total*100),barW=Math.round(data.total/maxTotal*100);
    const color=isIncome?(INC_COLORS[cat]||'#34C759'):(CAT_COLORS[cat]||'#8E8E93');
    const sign=isIncome?'+':'-', amtColor=isIncome?'#34C759':'#FF3B30';
    const detailId=prefix+'-detail-'+idx;
    const subRows=data.items.sort((a,b)=>b.date.localeCompare(a.date)).map(tx=>`
      <div class="sub-item">
        <div class="sub-item-left"><span class="sub-item-desc">${tx.desc}</span><span class="sub-item-date">${tx.date}</span></div>
        <div class="sub-item-right"><span class="sub-item-amt" style="color:${amtColor}">${sign}${fmt(tx.amount)}</span><button class="sub-edit-btn" onclick="openEdit(${tx.id})">✏️</button></div>
      </div>`).join('');
    html+=`<div class="cat-card">
      <div class="cat-card-header">
        <div class="cat-icon-big">${getIcon(cat)}</div>
        <div class="cat-card-info"><div class="cat-card-name">${cat}</div><div class="cat-card-count">${t('cat_count',data.items.length,pct)}</div></div>
        <div class="cat-card-total" style="color:${amtColor}">${sign}${fmt(data.total)}</div>
      </div>
      <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${barW}%;background:${color}"></div></div>
      <button class="toggle-detail" onclick="toggleDetail('${detailId}',this)">${t('detail_open',data.items.length)}</button>
      <div class="sub-items" id="${detailId}">${subRows}</div>
    </div>`;
  });
  return html;
}

function buildBackupData(label){return{version:1,backupDate:today(),label:label||today(),transactions,presets};}
function shareBackupFile(filename,data){
  const json=JSON.stringify(data,null,2),blob=new Blob([json],{type:'application/json'}),file=new File([blob],filename,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({title:filename,text:filename,files:[file]}).then(()=>{recordBackup(data.label,transactions.length);showToast(t('toast_backup_ok'));renderBackupHistory();}).catch(e=>{if(e.name!=='AbortError')fallbackDownload(filename,json);});
  } else { fallbackDownload(filename,json); }
}
function fallbackDownload(filename,json){
  const blob=new Blob([json],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);
  recordBackup(filename,'');showToast(t('toast_backup_dl'));renderBackupHistory();
}
function recordBackup(label,count){
  const h=loadBackupHistory().filter(x=>x.date!==today());
  h.unshift({date:today(),label,count,ts:Date.now()});
  saveBackupHistory(h.slice(0,30));
  localStorage.setItem('pocket_last_backup',today());
}
function manualBackup(){
  const ts=Date.now();saveSnapshot(ts);
  shareBackupFile(t('backup_file_prefix')+today()+'.json',buildBackupData(today()));
}
function checkAutoBackup(){
  const last=localStorage.getItem('pocket_last_backup')||'',dismissed=localStorage.getItem('pocket_backup_dismissed')||'';
  if(last===today()||dismissed===today()||!transactions.length) return;
  setTimeout(()=>{
    document.getElementById('backup-alert-desc').innerHTML=t('alert_backup_desc');
    document.getElementById('backup-alert').classList.add('open');
  },1200);
}
function doAutoBackup(){document.getElementById('backup-alert').classList.remove('open');manualBackup();}
function dismissBackupAlert(){localStorage.setItem('pocket_backup_dismissed',today());document.getElementById('backup-alert').classList.remove('open');}
function restoreFromFile(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.transactions||!Array.isArray(data.transactions))throw new Error();
      if(!confirm(t('confirm_restore_file',data.label||data.backupDate)))return;
      transactions=data.transactions;if(data.presets)presets=data.presets;
      save();savePresets();render();renderSettings();showToast(t('toast_restore_ok'));
    }catch{showToast(t('toast_restore_err'));}
    input.value='';
  };reader.readAsText(file);
}
function saveSnapshot(ts){
  const snaps=JSON.parse(localStorage.getItem('pocket_snapshots')||'{}');
  snaps[ts]={transactions:JSON.parse(JSON.stringify(transactions)),presets:JSON.parse(JSON.stringify(presets))};
  const keys=Object.keys(snaps).map(Number).sort((a,b)=>b-a).slice(0,30);
  const pruned={};keys.forEach(k=>{pruned[k]=snaps[k];});
  localStorage.setItem('pocket_snapshots',JSON.stringify(pruned));
}
function restoreFromHistory(ts){
  const snap=JSON.parse(localStorage.getItem('pocket_snapshots')||'{}')[ts];
  if(!snap){showToast(t('toast_no_snap'));return;}
  if(!confirm(t('confirm_restore_snap')))return;
  transactions=snap.transactions;if(snap.presets)presets=snap.presets;
  save();savePresets();render();showToast(t('toast_restore_ok'));
}
function renderBackupHistory(){
  const el=document.getElementById('backup-history-list');
  const h=loadBackupHistory();
  const last=localStorage.getItem('pocket_last_backup');
  document.getElementById('last-backup-log').textContent=last?t('last_backup_prefix')+last:t('no_backup');
  if(!h.length){el.innerHTML=`<div style="font-size:13px;color:#C7C7CC;padding:8px 0;text-align:center">${t('no_backup_history')}</div>`;return;}
  el.innerHTML=h.map(x=>`
    <div class="backup-history-item">
      <div><div class="backup-history-date">📁 ${x.label}</div><div class="backup-history-info">${t('tx_count',x.count)}</div></div>
      <button class="restore-btn" onclick="restoreFromHistory(${x.ts})">${t('restore_snap')}</button>
    </div>`).join('');
}

    <div class="month-panel" style="background:linear-gradient(160deg,#0F6E56 0%,#1D9E75 100%)">
      <div class="mp-title">📅 ${lang==='ko'?'오늘 ('+todayNum+'일)':'Today ('+todayNum+')'}</div>

      <div class="mp-row">
        <div class="mp-label">${lang==='ko'?'일 목표':'Target'}</div>
        <div class="mp-val">${fmt(b.daily)}</div>
      </div>

      <div class="mp-row">
        <div class="mp-label">${lang==='ko'?'오늘 지출':'Spent'}</div>
        <div class="mp-val">${fmt(todayExp)}</div>
      </div>

      <div class="mp-progress-track">
        <div class="mp-progress-fill" style="width:${Math.min(100,Math.round(todayExp/b.daily*100))}%;background:${todayExp>b.daily?'#FF3B30':'rgba(255,255,255,.9)'}"></div>
      </div>
      <div class="mp-progress-labels">
        <span>0</span><span>${fmt(b.daily)}</span>
      </div>

      <div class="mp-divider"></div>

      <div class="mp-row" style="margin-bottom:0">
        <div class="mp-label">${lang==='ko'?'목표 대비':'vs Target'}</div>
        <div class="mp-today-diff ${diffClass}" style="margin-top:4px;font-size:16px">${diffText}</div>
      </div>

      <div class="mp-row" style="margin-top:10px;margin-bottom:0">
        <div class="mp-label">${lang==='ko'?'이번 달 남은 날':'Days left'}</div>
        <div class="mp-val" style="font-size:14px">${daysInMonth - todayNum}${lang==='ko'?'일':'d'}</div>
      </div>
    </div>`;

  // ── 오른쪽 막대그래프 HTML ──
  let bars = '';
  for(let day=1; day<=daysInMonth; day++){
    const dow = new Date(d.getFullYear(), d.getMonth(), day).getDay();
    const isFuture = day > todayNum;
    const isToday = day === todayNum;
    const spent = dayMap[day]?.total || 0;

    // 목표 막대 높이 (%)
    const targetH = Math.round(b.daily / chartMax * 100);
    // 실제 막대 높이 (%)
    const actualH = isFuture ? 0 : Math.round(spent / chartMax * 100);
    // 색상
    const actualColor = spent > b.daily ? '#FF3B30' : spent > 0 ? '#34C759' : 'transparent';

    const dayLabelClass = isToday ? 'bar-day-label is-today' : dow===0 ? 'bar-day-label is-sun' : dow===6 ? 'bar-day-label is-sat' : 'bar-day-label';

    bars += `
      <div class="bar-col${isToday?' is-today':''}${isFuture?' bar-future':''}">
        <div class="bar-target" style="height:${targetH}%"></div>
        <div class="bar-actual" style="height:${actualH}%;background:${actualColor}"></div>
        <div class="${dayLabelClass}">${day}</div>
      </div>`;
  }

  const rightPanel = `
    <div class="chart-panel">
      <div class="cp-title">${lang==='ko'?'일별 지출 vs 목표':'Daily vs Target'}</div>
      <div class="cp-legend">
        <div class="cp-legend-item"><div class="cp-legend-dot" style="background:#4F46E5;opacity:.3"></div>${lang==='ko'?'목표':'Target'} ${fmt(b.daily)}</div>
        <div class="cp-legend-item"><div class="cp-legend-dot" style="background:#34C759"></div>${lang==='ko'?'미달':'Under'}</div>
        <div class="cp-legend-item"><div class="cp-legend-dot" style="background:#FF3B30"></div>${lang==='ko'?'초과':'Over'}</div>
      </div>
      <div class="bar-chart-area">
        <div class="bar-chart-inner">${bars}</div>
      </div>
    </div>`;

  el.innerHTML = `<div class="home-wrap"><div class="top-row">${leftPanel}${todayPanel}</div>${rightPanel}</div>`;

}

// ── 탭 ──
function switchTab(tab){
  ['home','list','add','chart','settings'].forEach(t=>{
    document.getElementById('tab-'+t)?.classList.toggle('active',t===tab);
    document.getElementById('content-'+t)?.classList.toggle('active',t===tab);
  });
  if(tab==='settings'){renderSettings();initBudgetUI();}
  if(tab==='home') renderHome();
}

// ── 토스트 ──
function showToast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}

document.getElementById('edit-modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

// ── 초기화 ──
function render(){updateSummary();renderList();renderChart();renderHome();}
document.getElementById('inp-date').value=today();
// 기본 통화 HKD (최초 실행 시)
if(!localStorage.getItem('pocket_currency')) saveCurrency('HKD');
initLangUI();initCurrencyUI();initBudgetUI();
renderQuickBtns();render();
applyI18n();   // render() 이후 호출해야 동적 생성 텍스트에도 적용됨
checkAutoBackup();
</script>
